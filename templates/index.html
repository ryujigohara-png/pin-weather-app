<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin_Weather Pro - Windy Filter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #007bff; font-size: 18px;">⛵ Pin_Weather!</span>
        <span class="close-sidebar" onclick="toggleSidebar()" style="cursor: pointer; font-size: 24px; padding: 0 5px;">&times;</span>
    </div>
    
    <button class="btn btn-wind-config" id="wind-cfg-btn">🎐 風向色付設定</button>
    <button class="btn btn-reset" id="reset-all-btn">♻️ 全リセット</button>
    
    <div class="sidebar-qr-container" style="margin-top: 30px; padding: 10px; text-align: center; border-top: 1px solid #eee;">
        <div style="font-size: 12px; color: #666; margin-bottom: 8px;">スマホで共有</div>
        <div id="sidebar-qrcode" style="display: inline-block; background: white; padding: 5px;"></div>
    </div>
</div>

<div class="control-wrapper">
    <button class="menu-trigger" onclick="toggleSidebar()">☰</button>
    <div class="scroll-tabs" id="spot-tabs"></div>
    <button class="btn btn-add" id="add-btn">＋</button>
    <span class="current-pos-label" id="pos-display" style="display:none;"></span>
</div>

<div id="map-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="search-bar">
            <input type="text" id="map-search-input" class="search-input" placeholder="地名・施設名を入力して検索...">
            <button class="btn" style="background:#007bff; color:white;" id="map-search-btn">検索</button>
        </div>
        <div id="map-canvas"></div>
        <div class="modal-footer">
            <span id="map-status" style="margin-right:auto; font-size:12px; color:#666;">地点をクリックしてください</span>
            <button class="btn" style="background:#6c757d; color:white;" onclick="closeModal('map-modal')">キャンセル</button>
            <button class="btn" style="background:#28a745; color:white;" id="temp-view-btn" disabled>登録せずに表示</button>
            <button class="btn" style="background:#007bff; color:white;" id="save-spot-btn" disabled>MySpotsに登録</button>
        </div>
    </div>
</div>

<div id="wind-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 450px; height: auto; min-height: 500px;">
        <div style="padding:15px; border-bottom:1px solid #ddd; font-weight:bold;">色付けする風向を選択</div>
        <div class="compass-container" id="compass-ui">
            <div class="compass-center">中央をクリックで<br>全選択 / 解除</div>
        </div>
        <div class="modal-footer">
            <button class="btn" style="background:#6c757d; color:white;" onclick="closeModal('wind-modal')">閉じる</button>
            <button class="btn" style="background:#6f42c1; color:white;" id="apply-wind-btn">更新して適用</button>
        </div>
    </div>
</div>

<div class="main-card">
    <div class="scroll-container" id="scroll-root">
        <div class="chart-stage" id="stage">
            <div id="hover-guide"></div>
            <div class="chart-section section-weather">
                <div class="sticky-label"><div class="y-axis-title" style="margin-top:20px;">🌦️ 天気<br>降水量mm</div></div>
                <svg id="svg-weather" viewBox="0 0 6912 80"></svg>
            </div>
            <div class="chart-section section-wind" style="border-bottom: none;">
                <div class="sticky-label"><div class="y-axis-title">🚩 風向<br>風速(m/s)</div></div>
                <div class="date-container" id="date-wind"></div>
                <svg id="svg-wind" viewBox="0 0 6912 220" preserveAspectRatio="none"></svg>
            </div>
            <div class="chart-section section-temp" style="border-bottom: none;">
                <div class="sticky-label"><div class="y-axis-title">🌡️ 気温(℃)<br>💧 海水(℃)</div></div>
                <div class="date-container" id="date-temp"></div>
                <svg id="svg-temps" viewBox="0 0 6912 110" preserveAspectRatio="none"></svg>
            </div>
            <div class="chart-section section-marine">
                <div class="sticky-label"><div class="y-axis-title">🌊 波高<br>潮位(m)</div></div>
                <div class="date-container" id="date-marine"></div>
                <svg id="svg-marine" viewBox="0 0 6912 110" preserveAspectRatio="none"></svg>
            </div>
        </div>
    </div>
</div>

<div class="footer-info">
    Weather data by <a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a><br>
    【免責事項】海上気象データは予測モデルに基づく「最寄りの海上地点」の数値であり、実際の局地的な地形や潮流による影響を反映しきれない場合があります。
</div>

<div id="tooltip" class="tooltip"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
